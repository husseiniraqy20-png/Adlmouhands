name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Folder & Build APK
        run: |
          mkdir -p www
          cp *.html *.js *.json *.webmanifest *.png *.ico *.svg *.css www/ 2>/dev/null || true
          npm install
          npx cap init "تطبيق قسم الإعلام" "com.almuhandis.media" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almuhandis-Media-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
