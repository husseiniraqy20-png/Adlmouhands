<style>
:root{--teal:#0B4F56;--gold:#C69C3A;--ruby:#C81D25;--bg:#F4F7F8;--card:#fff;--tx:#17262a;--mut:#5d7176;--bd:#dbe4e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b1e;--card:#14292d;--tx:#e8f0f1;--mut:#9fb3b7;--bd:#244047;--gold:#d8ae4c}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:78px}
header{background:var(--teal);color:#fff;border-bottom:4px solid var(--gold);padding:8px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header img{width:46px;height:46px;border-radius:10px;background:#fff;border:2px solid var(--gold)}
header h1{font-size:17px;margin:0;color:var(--gold);line-height:1.2}header small{opacity:.85;font-size:11px}
header select{width:auto;max-width:130px;margin:0;padding:5px;font-size:13px}
button,input,select,textarea{font:inherit}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.gold{background:var(--gold);color:#1b1500}.btn.red{background:var(--ruby)}.btn.ghost{background:transparent;color:inherit;border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.4}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;color:var(--teal);margin:4px 0 12px;border-right:4px solid var(--gold);padding-right:10px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:24px;color:var(--teal)}.stat span{color:var(--mut);font-size:13px}
.stat.g b{color:var(--gold)}.stat.r b{color:var(--ruby)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1 0 54px;background:none;border:0;padding:8px 1px;color:var(--mut);font-size:10.5px;cursor:pointer}
nav button.on{color:var(--teal);font-weight:700;box-shadow:inset 0 3px var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:var(--gold)}}
nav i{display:block;font-style:normal;font-size:18px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:3px 0 9px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;background:var(--bd);color:var(--tx)}
.tag.ok{background:#d5efe0;color:#14532d}.tag.bad{background:#f8d7d9;color:#8a1219}.tag.wip{background:#f6e8c4;color:#6b4e00}
.toast{position:fixed;top:84px;inset-inline:16px;margin:auto;max-width:440px;background:var(--teal);color:#fff;padding:10px 14px;border-radius:10px;z-index:9;border-right:4px solid var(--gold)}
.mut{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);padding:14px}
.prof{display:flex;gap:12px;align-items:center}.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--teal);color:var(--gold);display:grid;place-items:center;font-size:26px;font-weight:700;flex:0 0 64px;border:2px solid var(--gold)}
.gps{padding:8px 10px;border-radius:8px;background:var(--bg);margin-bottom:10px;font-size:14px}
.login{max-width:380px;margin:6vh auto;text-align:center}.login img{width:150px;height:150px}
.pk{position:relative;overflow:hidden;display:inline-block;flex:0 0 auto;margin:2px}.pk input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.bdg{background:var(--ruby);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-inline-start:3px}
.credit{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 6px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><img id="hl" alt="الشعار"><div><h1>المهندس</h1><small>إدارة الحضور والمهام والإجازات</small></div><span style="flex:1"></span><select id="hs" onchange="DB.cur=this.value;save();render()" hidden></select><button class="btn sm gold" id="hin" hidden>تثبيت</button><button class="btn sm gold" id="hout" onclick="logout()" hidden>خروج</button></header>
<main id="v"></main>
<nav id="nav"></nav>
